<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>KKT Input</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen flex items-center justify-center bg-[#f8faff] font-['Plus_Jakarta_Sans']">
    
    <div id="loader" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-[#1e293b] hidden">
        <div class="w-20 h-20 bg-blue-600 rounded-full flex items-center justify-center text-4xl text-white mb-6 font-bold animate-pulse">λ</div>
        <h1 class="text-3xl font-bold text-white mb-4">Computing Optimal Solution...</h1>
        <div class="w-64 h-1.5 bg-slate-700 rounded-full overflow-hidden">
            <div class="h-full bg-blue-500 w-1/2 animate-[progress_1.5s_infinite_linear]"></div>
        </div>
    </div>
    <style> @keyframes progress { from { transform: translateX(-100%); } to { transform: translateX(200%); } } </style>

    <div id="card" class="bg-white w-full max-w-2xl p-14 rounded-[50px] shadow-2xl border border-slate-100">
        <h1 class="text-center text-5xl font-black text-[#4d4dff] mb-12">Set Up Problem</h1>
        <form action="/solve" method="POST" class="space-y-6">
            <div>
                <label class="block font-bold text-slate-700 mb-2">Number of Variables ($n$)</label>
                <input type="number" name="n" value="2" class="w-full p-5 border border-slate-200 rounded-2xl outline-none focus:ring-4 focus:ring-blue-100">
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-2">Objective Function $f(x)$</label>
                <input type="text" name="f" placeholder="e.g. 8*x1 - x1**2" class="w-full p-5 border border-slate-200 rounded-2xl outline-none" required>
            </div>
            <div>
                <label class="block font-bold text-slate-700 mb-2">Constraint $h(x) \le 0$</label>
                <input type="text" name="g" placeholder="e.g. x1 - 2" class="w-full p-5 border border-slate-200 rounded-2xl outline-none" required>
            </div>
            <div class="grid grid-cols-2 gap-4">
                <label><input type="radio" name="type" value="max" class="hidden peer" checked><div class="p-5 text-center bg-slate-100 rounded-2xl font-bold cursor-pointer peer-checked:bg-[#4d4dff] peer-checked:text-white transition">Maximize</div></label>
                <label><input type="radio" name="type" value="min" class="hidden peer"><div class="p-5 text-center bg-slate-100 rounded-2xl font-bold cursor-pointer peer-checked:bg-[#4d4dff] peer-checked:text-white transition">Minimize</div></label>
            </div>
            <button type="submit" class="w-full bg-[#4d4dff] text-white p-6 rounded-[24px] font-black text-xl shadow-lg shadow-blue-200">Solve Problem →</button>
        </form>
    </div>

    <script>
        document.querySelector('form').addEventListener('submit', () => {
            document.getElementById('loader').classList.remove('hidden');
            document.getElementById('card').classList.add('hidden');
        });
    </script>
</body>
</html>
